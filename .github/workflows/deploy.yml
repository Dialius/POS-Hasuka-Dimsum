name: Deploy Static POS to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Permissions untuk GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Batasi hanya satu deployment berjalan pada satu waktu
concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'pos-kasir/package-lock.json'

      - name: Install dependencies
        working-directory: pos-kasir
        run: npm ci

      - name: Build frontend
        working-directory: pos-kasir
        run: npm run build
        env:
          VITE_BASE_PATH: './'
          # Opsional: Jika user ingin menyetel URL/Token default di build time melalui GitHub Secrets
          # VITE_GAS_URL: ${{ secrets.VITE_GAS_URL }}
          # VITE_GAS_TOKEN: ${{ secrets.VITE_GAS_TOKEN }}

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'pos-kasir/dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

